spring:
  datasource:
    url: jdbc:h2:mem:audit_log;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: true
      path: /h2-console

audit:
  security:
    password: ${AUDIT_LOG_API_PASSWORD:local-dev-only-change-me}
    swagger-public: true
    h2-console-public: true
