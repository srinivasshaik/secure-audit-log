spring:
  application:
    name: secure-audit-log
  profiles:
    default: dev
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html

audit:
  security:
    username: ${AUDIT_LOG_API_USERNAME:audit-service}
    roles:
      - AUDIT_READER
      - AUDIT_WRITER
      - AUDIT_PRIVACY_OFFICER
      - COMPLIANCE_OFFICER
      - SYSTEM_ADMIN
  rate-limit:
    requests-per-minute: ${AUDIT_LOG_RATE_LIMIT_PER_MINUTE:120}
    max-clients: ${AUDIT_LOG_RATE_LIMIT_MAX_CLIENTS:10000}

  retention:
    archive-after: 365d
    archive-cron: "0 0 2 * * *"

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%X{correlationId:-}] %logger{36} - %msg%n"
